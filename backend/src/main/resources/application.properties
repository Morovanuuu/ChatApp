spring.application.name=backend

# Conexiunea la PostgreSQL pornit cu: docker compose up -d (din radacina repo-ului)
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=chatapp
spring.datasource.password=chatapp

# Schema o creeaza Flyway (src/main/resources/db/migration).
# Hibernate doar verifica faptul ca entitatile corespund tabelelor.
spring.jpa.hibernate.ddl-auto=validate

# Conexiunea se inchide la iesirea din service; tot ce trebuie se incarca explicit (@EntityGraph).
spring.jpa.open-in-view=false

# JWT: in productie cheia vine din variabila de mediu JWT_SECRET; valoarea de dupa ":" e doar pentru dezvoltare
app.jwt.secret=${JWT_SECRET:cheie-de-dezvoltare-ChatApp-schimbati-o-in-productie-2026}
app.jwt.valabilitate=PT1H

# Afiseaza SQL-ul generat
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
